plugins {
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.3' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.4.0' apply false
    id 'idea'
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'org.jetbrains.kotlin.jvm'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven {
            name = "Impact Dev"
            url = "https://maven.impactdev.net/repository/development/"
        }

        maven {
            name = "Team Resourceful"
            url = "https://maven.teamresourceful.com/repository/maven-public/"
        }
        maven {
            url = uri("https://maven.dediamondpro.dev/releases")
        }
        maven {
            name = "MCEF"
            url = uri("https://mcef-download.cinemamod.com/repositories/releases")
        }

        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven/"
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.layered {
            it.mappings("net.fabricmc:yarn:$rootProject.yarn_mappings:v2")
            it.mappings("dev.architectury:yarn-mappings-patch-neoforge:$rootProject.yarn_mappings_patch_neoforge_version")
        }
    }

    java {
        //withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlin {
        jvmToolchain(21)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    tasks.named("jar", Jar) {
        from(rootProject.file("LICENSE")) {
            rename { "${it}" }
        }
        from(rootProject.file("icon.png")) {
            rename { "${it}" }
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
        repositories {}
    }
}
